{% extends "base.html" %}
{% block title %}{{ t('welcome') }}{% endblock %}
{% block content %}
<div class="center-box card">
  <h2>{{ t('welcome') }}</h2>
  <p class="muted">{{ t('intro', course=course) }}</p>
  <form method="post">
    {% if courses|length > 1 %}
    <label class="small" for="course">{{ t('choose_course') }}</label>
    <select id="course" name="course" style="width:100%;margin-bottom:12px">
      {% for c in courses %}<option value="{{ c.code }}" {{ 'selected' if c.code == course_code }}>{{ c.title }}</option>{% endfor %}
    </select>
    {% endif %}
    <label class="small" for="code">{{ t('student_code') }}</label>
    <input type="text" id="code" name="code" placeholder="{{ t('code_ph') }}" autofocus required maxlength="20" dir="ltr">
    <p class="muted small">{{ t('privacy') }}</p>
    <button class="btn" type="submit">{{ t('start_btn') }}</button>
  </form>
</div>
{% endblock %}
