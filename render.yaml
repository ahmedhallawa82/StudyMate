services:
  - type: web
    name: studymate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LECTURER_PASSWORD
        value: lecturer123
      - key: SECRET_KEY
        generateValue: true
